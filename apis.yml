aid: triditive
name: TRIDITIVE
description: TRIDITIVE is an automated additive manufacturing company founded in 2016 and headquartered
  in Meres, Asturias, Spain, with offices in Hartford, Connecticut and London. It builds the AMCELL
  family of automated industrial 3D printing machines (Amcell 1300, 4300, 8300, Bulkam), the Traced
  traceability system, and the EVAM Software platform for additive manufacturing workflow management,
  digital warehousing, and on-demand production of polymer and metal parts. A Techstars portfolio
  company, TRIDITIVE publishes no public API, developer portal, or client SDKs as of July 2026.
